<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopQuick — Mini E-Commerce</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════
       HEADER
  ════════════════════════════════════════════ -->
  <header class="site-header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">🛍️</span>
        <span class="logo-text">ShopQuick</span>
      </div>

      <div class="header-controls">
        <!-- Search -->
        <div class="search-wrap">
          <input id="searchInput" type="text" placeholder="Search products…" autocomplete="off" />
          <span class="search-icon">🔍</span>
        </div>

        <!-- Category filter -->
        <select id="categoryFilter" title="Filter by category">
          <option value="all">All Categories</option>
          <option value="Stationery">Stationery</option>
          <option value="Electronics">Electronics</option>
          <option value="Books">Books</option>
          <option value="Kitchen">Kitchen</option>
          <option value="Lifestyle">Lifestyle</option>
        </select>

        <!-- Cart button -->
        <button class="cart-btn" id="cartToggle" aria-label="Open cart">
          🛒 Cart <span class="cart-badge" id="cartBadge">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ═══════════════════════════════════════════
       MAIN LAYOUT
  ════════════════════════════════════════════ -->
  <main class="main-layout">

    <!-- ── PRODUCT CATALOGUE ── -->
    <section class="catalogue-section">
      <h2 class="section-title" id="catalogueHeading">All Products</h2>
      <div class="product-grid" id="productGrid">
        <!-- Cards injected by JS -->
      </div>
      <p class="no-results hidden" id="noResults">No products match your search.</p>
    </section>

    <!-- ── CART SIDEBAR ── -->
    <aside class="cart-sidebar" id="cartSidebar">
      <div class="cart-header">
        <h2>Your Cart</h2>
        <button class="close-cart" id="closeCart" aria-label="Close cart">✕</button>
      </div>

      <div class="cart-body" id="cartBody">
        <!-- Cart rows injected by JS -->
      </div>

      <div class="cart-footer" id="cartFooter">
        <!-- Summary injected by JS -->
      </div>
    </aside>

  </main>

  <!-- ═══════════════════════════════════════════
       CHECKOUT MODAL  (HTML <dialog>)
  ════════════════════════════════════════════ -->
  <dialog class="checkout-dialog" id="checkoutDialog" aria-modal="true" aria-label="Order summary">
    <div class="dialog-inner">
      <div class="dialog-header">
        <h2>🧾 Order Summary</h2>
        <button class="dialog-close" id="dialogClose" aria-label="Close dialog">✕</button>
      </div>

      <div class="demo-banner">
        ⚠️ This is a <strong>demo checkout</strong>. No payment is processed and no real order is placed.
      </div>

      <div id="dialogBody" class="dialog-body">
        <!-- Summary rows injected by JS -->
      </div>

      <div class="dialog-actions">
        <button class="btn-secondary" id="dialogCancel">Back to Cart</button>
        <button class="btn-primary placed-btn" id="placeOrder">✔ Place Demo Order</button>
      </div>
    </div>
  </dialog>

  <!-- ═══════════════════════════════════════════
       ORDER PLACED CONFIRMATION
  ════════════════════════════════════════════ -->
  <dialog class="confirm-dialog" id="confirmDialog" aria-modal="true">
    <div class="confirm-inner">
      <div class="confirm-icon">🎉</div>
      <h2>Demo Order Placed!</h2>
      <p>Your mock order has been recorded. No payment has been taken.</p>
      <button class="btn-primary" id="confirmOk">Continue Shopping</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
